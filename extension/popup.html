<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaisaWise</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <h1 class="title">PaisaWise</h1>
        <p class="subtitle">Smart Buy & Price Oracle</p>
      </div>
    </div>
    <div id="connection-status" class="status-indicator status-checking" title="Checking local backend...">
      <span class="status-dot"></span>
      <span id="status-text" class="status-label">Checking</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="content">
    <!-- Active Product Card (if on Amazon or Flipkart) -->
    <div id="active-product-section" class="section hidden">
      <div class="section-badge">Active Product Detected</div>
      <div class="card" id="active-product-card">
        <div class="spinner-container">
          <div class="spinner"></div>
          <span class="muted-text">Analyzing page with Price Oracle...</span>
        </div>
      </div>
    </div>

    <!-- Manual Search Section -->
    <div id="search-section" class="section">
      <label for="url-input" class="input-label">Check Amazon or Flipkart Link</label>
      <div class="search-box">
        <input type="text" id="url-input" placeholder="Paste product URL..." autocomplete="off">
        <button id="analyze-btn" class="btn btn-primary">Analyze</button>
      </div>
      <div id="search-error" class="error-box hidden"></div>
      <div id="search-results" class="results-box hidden"></div>
    </div>

    <!-- Financial Quick Snapshot -->
    <div id="finance-snapshot-section" class="section">
      <div class="snapshot-header">
        <span class="input-label">Personal Finance Snapshot</span>
        <a href="http://localhost:3000" target="_blank" class="link-muted">Open Dashboard &rarr;</a>
      </div>
      <div class="snapshot-grid">
        <div class="stat-card">
          <span class="stat-label">Net Balance</span>
          <span id="stat-balance" class="stat-value">--</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Month Spend</span>
          <span id="stat-spend" class="stat-value">--</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-privacy">100% Local &amp; Private</span>
    <a href="http://localhost:3000" target="_blank" class="footer-link">localhost:3000</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
