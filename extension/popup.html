<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaisaWise</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <h1 class="title">PaisaWise</h1>
        <p class="subtitle">Smart Buy &amp; Price Oracle</p>
      </div>
    </div>
    <div class="status-indicator status-online" title="Ready to inspect Amazon and Flipkart products">
      <span class="status-dot"></span>
      <span class="status-label">Active</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="content">
    <!-- Active Product Card (if on Amazon or Flipkart) -->
    <div id="active-product-section" class="section hidden">
      <div class="active-badge-row">
        <span class="section-badge">Active Product Detected</span>
        <button id="toggle-search-btn" class="link-btn">Check another link &rarr;</button>
      </div>
      <div class="card" id="active-product-card">
        <div class="spinner-container">
          <div class="spinner"></div>
          <span class="muted-text">Reading page price and history...</span>
        </div>
      </div>
    </div>

    <!-- Manual Search Section -->
    <div id="search-section" class="section">
      <label for="url-input" class="input-label">Check Amazon or Flipkart Link</label>
      <div class="search-box">
        <input type="text" id="url-input" placeholder="Paste Amazon or Flipkart link..." autocomplete="off">
        <button id="analyze-btn" class="btn btn-primary">Analyze</button>
      </div>
      <div id="search-error" class="error-box hidden"></div>
      <div id="search-results" class="results-box hidden"></div>
    </div>

    <!-- Personal Reality Settings -->
    <div class="section">
      <div class="settings-card">
        <div class="settings-row">
          <div>
            <span class="input-label" style="margin-bottom: 2px; display: block;">Your Monthly Income</span>
            <span class="muted-text">For the hours-of-work reality check</span>
          </div>
          <div class="income-input-wrap">
            <span class="currency-symbol">₹</span>
            <input type="number" id="income-input" value="60000" step="5000" min="1000">
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-privacy">100% On-Device &amp; Private</span>
    <span class="footer-tag">Amazon &amp; Flipkart</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
