name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Chrome Extension
        run: |
          cd extension
          zip -r ../paisawise-extension.zip . -x "*.DS_Store"
          cd ..
          ls -lh paisawise-extension.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: paisawise-extension.zip
          name: PaisaWise Release ${{ github.ref_name }}
          body: |
            ## PaisaWise Release Assets

            ### Chrome Extension (Manifest V3)
            Download `paisawise-extension.zip` below to use the Smart Buy & Price History Oracle directly on Amazon & Flipkart!

            #### How to Install:
            1. Download and extract `paisawise-extension.zip`.
            2. Open Chrome and go to `chrome://extensions/`.
            3. Enable **Developer mode** in the top-right corner.
            4. Click **Load unpacked** and select the extracted folder.
          draft: false
          prerelease: false
